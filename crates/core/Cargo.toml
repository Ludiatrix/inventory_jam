[package]
name = "core"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[features]
dev = ["bevy/dynamic_linking"]
default = ["client", "gui", "server", "netcode", "udp", "webtransport", "dev"]
client = ["lightyear/client"]
gui = []
server = [
    "lightyear/client",
    "lightyear/server",
    "dep:sqlx",
    "dep:tokio",
    "dep:uuid",
    "dep:sha2",
    "dep:hex",
]
netcode = ["lightyear/netcode"]
udp = ["lightyear/udp", "lightyear/std"]
link_conditioner = []
webtransport = [
    "lightyear/webtransport",
    "lightyear/webtransport_self_signed",
    "lightyear/webtransport_dangerous_configuration",
]

[dependencies]
bevy = { workspace = true }
bevy_kira_audio = { workspace = true }
bevy_asset_loader = { workspace = true }
rand = { workspace = true }
virtual_joystick = { workspace = true }
webbrowser = { workspace = true }

winit = { workspace = true }
image = { workspace = true }
log = { workspace = true }
lightyear = { workspace = true }
leafwing-input-manager = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bevy_mod_reqwest = { workspace = true }
async-compat = { workspace = true }
anyhow = { workspace = true }
aeronet_io = { workspace = true }
clap = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { workspace = true }
getrandom04 = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
